<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presenter Controller</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.container{max-width:620px;margin:auto}
h1{margin:0 0 6px;font-size:30px}
.subtitle{color:#888;margin-bottom:22px}
.card{background:#17171a;border:1px solid #29292e;border-radius:18px;padding:18px;margin-bottom:16px}
button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:10px;font-size:17px;font-weight:600;color:#fff;background:#2b2b31}
button.primary{background:#1677ff}

button.primary.active{background:#0d5dcc}
button.danger{background:#b82b2b}
button:disabled{opacity:.35}
button.spotlight{
  background:#f5a623;
  color:#111;
}

button.spotlight.active{
  background:#ffd166;
  color:#111;
}

label{display:block;margin-top:17px;margin-bottom:7px;color:#aaa;font-size:14px}
input[type=range]{width:100%}
.value{float:right;color:#fff;font-weight:600}
.status{padding:12px;border-radius:12px;background:#101012;color:#999;font-size:14px;margin-top:12px}
.status.ok{color:#63df72}
.status.error{color:#ff6666}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sensor{background:#101012;border-radius:10px;padding:10px;text-align:center}
.sensor small{display:block;color:#666;margin-bottom:3px}
.sensor strong{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="container">

<h1>Presenter Controller</h1>
<div class="subtitle">Smartphone Presenter Prototype</div>

<div class="card">
<button id="sensorButton" class="primary">Sensor aktivieren</button>
<div id="sensorStatus" class="status">Sensor noch nicht aktiviert.</div>

<div class="values">
<div class="sensor"><small>Alpha</small><strong id="alpha">–</strong></div>
<div class="sensor"><small>Beta</small><strong id="beta">–</strong></div>
<div class="sensor"><small>Gamma</small><strong id="gamma">–</strong></div>
</div>
</div>

<div class="card">
<label>
Horizontal
<span class="value" id="horizontalValue">3</span>
</label>
<input id="horizontalSensitivity" type="range" min="1" max="100" value="3">

<label>
Vertikal
<span class="value" id="verticalValue">3</span>
</label>
<input id="verticalSensitivity" type="range" min="1" max="100" value="3">

<button id="pointerButton" class="primary">Pointer aktivieren</button>
</div>
<div class="card">
<button id="spotlightButton" class="spotlight">
Spotlight aktivieren
</button>

<button id="blackButton">BLACK</button>
<button id="escapeButton">ESCAPE</button>
</div>

</div>

<script>
const WS_URL=`wss://${location.host}`;

let socket=null;
let sensorActive=false;
let pointerEnabled=false;

let lastAlpha=null;
let lastBeta=null;
let lastGamma=null;

const SENSITIVITY_SCALE=0.12;

const savedSettings=JSON.parse(
  localStorage.getItem("presenterPointerSettings")||"null"
);

let horizontalSensitivity=savedSettings?.horizontal??3;
let verticalSensitivity=savedSettings?.vertical??3;

const horizontalSlider=document.getElementById("horizontalSensitivity");
const verticalSlider=document.getElementById("verticalSensitivity");

horizontalSlider.value=horizontalSensitivity;
verticalSlider.value=verticalSensitivity;

function updateSensitivity(){
  horizontalSensitivity=Number(horizontalSlider.value);
  verticalSensitivity=Number(verticalSlider.value);

  document.getElementById("horizontalValue").textContent=horizontalSensitivity;
  document.getElementById("verticalValue").textContent=verticalSensitivity;

  localStorage.setItem(
    "presenterPointerSettings",
    JSON.stringify({
      horizontal:horizontalSensitivity,
      vertical:verticalSensitivity
    })
  );
}

horizontalSlider.addEventListener("input",updateSensitivity);
verticalSlider.addEventListener("input",updateSensitivity);
updateSensitivity();

function connect(){
  if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING))return;

  socket=new WebSocket(WS_URL);

  socket.addEventListener("open",()=>{
    console.log("WebSocket verbunden");
  });

  socket.addEventListener("close",()=>{
    console.log("WebSocket getrennt");
    setTimeout(connect,1500);
  });

  socket.addEventListener("error",e=>{
    console.error("WebSocket Fehler",e);
  });
}

connect();

function send(type,payload={}){
  if(!socket||socket.readyState!==WebSocket.OPEN)return;

  socket.send(JSON.stringify({
    type,
    timestamp:Date.now(),
    ...payload
  }));
}

function normalizeAngle(angle){
  while(angle>180)angle-=360;
  while(angle<-180)angle+=360;
  return angle;
}

function updateValues(alpha,beta,gamma){
  document.getElementById("alpha").textContent=alpha.toFixed(1);
  document.getElementById("beta").textContent=beta.toFixed(1);
  document.getElementById("gamma").textContent=gamma.toFixed(1);
}

function orientation(event){
  const alpha=event.alpha;
  const beta=event.beta;
  const gamma=event.gamma;

  if(alpha===null||beta===null||gamma===null)return;

  if(lastAlpha===null||lastBeta===null){
    lastAlpha=alpha;
    lastBeta=beta;
    lastGamma=gamma;
    sensorActive=true;
    updateValues(alpha,beta,gamma);
    return;
  }

  const deltaAlpha=normalizeAngle(alpha-lastAlpha);
  const deltaBeta=beta-lastBeta;

  lastAlpha=alpha;
  lastBeta=beta;
  lastGamma=gamma;

  updateValues(alpha,beta,gamma);

  if(pointerEnabled||spotlightEnabled){
    let dx=Math.abs(deltaAlpha)<0.05?0:deltaAlpha;
    let dy=Math.abs(deltaBeta)<0.05?0:deltaBeta;

    dx=-dx*horizontalSensitivity*SENSITIVITY_SCALE;
    dy=-dy*verticalSensitivity*SENSITIVITY_SCALE;

    if(dx!==0||dy!==0){
      send("POINTER_MOVE",{
        dx,dy,alpha,beta,gamma
      });
    }
  }
}

async function enableSensor(){
  try{
    if(
      typeof DeviceOrientationEvent!=="undefined" &&
      typeof DeviceOrientationEvent.requestPermission==="function"
    ){
      const permission=await DeviceOrientationEvent.requestPermission();

      if(permission!=="granted"){
        throw new Error("Sensorberechtigung wurde nicht erteilt.");
      }
    }

    window.addEventListener(
      "deviceorientation",
      orientation,
      true
    );

    const status=document.getElementById("sensorStatus");
    status.textContent="Sensor aktiviert – Smartphone bewegen.";
    status.classList.remove("error");
    status.classList.add("ok");

    document.getElementById("sensorButton").disabled=true;

  }catch(error){
    console.error(error);

    const status=document.getElementById("sensorStatus");
    status.textContent=error.message||"Sensor konnte nicht aktiviert werden.";
    status.classList.add("error");
  }
}

document.getElementById("sensorButton")
  .addEventListener("click",enableSensor);

document.getElementById("pointerButton")
  .addEventListener("click",()=>{
    if(!sensorActive){
      const status=document.getElementById("sensorStatus");
      status.textContent="Bitte zuerst den Sensor aktivieren.";
      status.classList.add("error");
      return;
    }

    pointerEnabled=!pointerEnabled;

    if(pointerEnabled){
      spotlightEnabled=false;

      const spotlightButton=
        document.getElementById("spotlightButton");

      spotlightButton.textContent=
        "Spotlight aktivieren";

      spotlightButton.classList.remove("active");

      send("MODE_CHANGE",{mode:"NONE"});
      send("POINTER_ENABLE");
    }else{
      send("POINTER_DISABLE");
    }

    const pointerButton=
      document.getElementById("pointerButton");

    pointerButton.textContent=
      pointerEnabled
        ?"Pointer deaktivieren"
        :"Pointer aktivieren";

    pointerButton.classList.toggle(
      "active",
      pointerEnabled
    );
  });

/* =========================
   SPOTLIGHT
========================= */

const spotlightButton =
  document.getElementById("spotlightButton");

spotlightButton.addEventListener(
  "click",
  () => {

    spotlightEnabled=!spotlightEnabled;

    const pointerButton=
      document.getElementById("pointerButton");

    if(spotlightEnabled){

      pointerEnabled=false;

      pointerButton.textContent=
        "Pointer aktivieren";

      pointerButton.classList.remove("active");

      send("POINTER_DISABLE");

      send(
        "MODE_CHANGE",
        {
          mode:"SPOTLIGHT"
        }
      );

      spotlightButton.textContent=
        "Spotlight deaktivieren";

      spotlightButton.classList.add("active");

    }else{

      send(
        "MODE_CHANGE",
        {
          mode:"NONE"
        }
      );

      spotlightButton.textContent=
        "Spotlight aktivieren";

      spotlightButton.classList.remove("active");

    }

  }
);


document.getElementById("blackButton")
  .addEventListener("click",()=>send("BLACK"));

document.getElementById("escapeButton")
  .addEventListener("click",()=>send("ESCAPE"));


</script>
</body>
</html>
