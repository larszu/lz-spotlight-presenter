<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Presenter Native Overlay</title>

<style>
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

body {
  position: fixed;
  inset: 0;
  pointer-events: none;
}


/* =========================================
   POINTER
   ========================================= */

#pointer {
  position: fixed;

  width: 28px;
  height: 28px;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background: red;

  border: 3px solid white;

  box-shadow:
    0 0 8px rgba(255,0,0,1),
    0 0 20px rgba(255,0,0,.8);

  display: none;

  pointer-events: none;

  z-index: 999999;
}


/* =========================================
   SPOTLIGHT
   ========================================= */

#spotlight {
  position: fixed;
  inset: 0;
  display: none;
  pointer-events: none;
  z-index: 999997;

  background:
    radial-gradient(
      circle 120px at var(--spotlight-x) var(--spotlight-y),
      transparent 0,
      transparent 85px,
      rgba(0,0,0,.12) 100px,
      rgba(0,0,0,.55) 125px,
      rgba(0,0,0,.78) 180px,
      rgba(0,0,0,.82) 100%
    );
}

#spotlight.active {
  display: block;
}

/* =========================================
   BLACK SCREEN
   ========================================= */

#black {
  position: fixed;
  inset: 0;

  background: #000;

  display: none;

  pointer-events: none;

  z-index: 999998;
}


/* =========================================
   DEBUG
   ========================================= */

#debug {
  position: fixed;

  left: 20px;
  top: 20px;

  width: 560px;

  padding: 16px;

  background: rgba(0,0,0,.88);

  color: #00ff66;

  border: 1px solid rgba(0,255,100,.5);

  border-radius: 6px;

  font-family:
    Menlo,
    Monaco,
    "Courier New",
    monospace;

  font-size: 13px;

  line-height: 1.5;

  white-space: pre-wrap;

  z-index: 1000000;

  pointer-events: none;

  /* DEBUG BLEIBT VOLLSTÄNDIG VORHANDEN,
     IST ABER NICHT SICHTBAR */
  display: none;
}
</style>
</head>

<body>

<div id="black"></div>
<div id="spotlight"></div>

<div id="pointer"></div>

<div id="debug"></div>


<script>

"use strict";


/* =========================================================
   ELEMENTE
   ========================================================= */

const pointer =
  document.getElementById("pointer");

const black =
  document.getElementById("black");

const spotlight =
  document.getElementById("spotlight");

const debug =
  document.getElementById("debug");


/* =========================================================
   POINTER STATE
   ========================================================= */

let pointerX =
  window.innerWidth / 2;

let pointerY =
  window.innerHeight / 2;

let pointerEnabled =
  false;

let spotlightEnabled =
  false;

let moveCount =
  0;

let lastDX =
  null;

let lastDY =
  null;

let lastRawMessage =
  null;

let lastPayload =
  null;

let lastType =
  null;


/* =========================================================
   DEBUG
   ========================================================= */

function updateDebug(extra = "") {

  const dx =
    lastDX === null
      ? "null"
      : String(lastDX);

  const dy =
    lastDY === null
      ? "null"
      : String(lastDY);

  debug.textContent =
`NATIVE OVERLAY DEBUG

Renderer:       OK
IPC:            ${window.electronAPI ? "AVAILABLE" : "MISSING"}

Display:        ${window.innerWidth} × ${window.innerHeight}

Pointer:        ${pointerEnabled ? "ENABLED" : "DISABLED"}

Position:       ${Math.round(pointerX)} / ${Math.round(pointerY)}

Move count:     ${moveCount}

Last dx:        ${dx}
Last dy:        ${dy}

Last type:      ${lastType ?? "none"}

Last payload:
${JSON.stringify(lastPayload, null, 2)}

Raw message:
${JSON.stringify(lastRawMessage, null, 2)}

${extra}`;
}


/* =========================================================
   POINTER RENDER
   ========================================================= */

function renderPointer() {

  pointer.style.left =
    `${pointerX}px`;

  pointer.style.top =
    `${pointerY}px`;

  updateSpotlight();
}


function updateSpotlight() {

  spotlight.style.setProperty(
    "--spotlight-x",
    `${pointerX}px`
  );

  spotlight.style.setProperty(
    "--spotlight-y",
    `${pointerY}px`
  );
}


/* =========================================================
   POINTER RESET
   ========================================================= */

function resetPointer() {

  pointerX =
    window.innerWidth / 2;

  pointerY =
    window.innerHeight / 2;

  renderPointer();
}


/* =========================================================
   POINTER ENABLE
   ========================================================= */

function enablePointer() {

  spotlightEnabled =
    false;

  spotlight.classList.remove(
    "active"
  );

  pointerEnabled =
    true;

  pointer.style.display =
    "block";

  renderPointer();

  updateDebug(
    "POINTER ENABLE"
  );
}


/* =========================================================
   POINTER DISABLE
   ========================================================= */

function disablePointer() {

  pointerEnabled =
    false;

  pointer.style.display =
    "none";

  updateDebug(
    "POINTER DISABLE"
  );
}


/* =========================================================
   PAYLOAD NORMALISIERUNG
   ========================================================= */

function extractMovement(message) {

  let payload =
    message?.payload;


  /* -----------------------------------------
     FALL 1:
     payload.dx / payload.dy
     ----------------------------------------- */

  if (
    payload &&
    typeof payload === "object"
  ) {

    if (
      payload.dx !== undefined ||
      payload.dy !== undefined
    ) {

      return {
        dx: Number(payload.dx),
        dy: Number(payload.dy)
      };

    }
  }


  /* -----------------------------------------
     FALL 2:
     message.dx / message.dy
     ----------------------------------------- */

  if (
    message?.dx !== undefined ||
    message?.dy !== undefined
  ) {

    return {
      dx: Number(message.dx),
      dy: Number(message.dy)
    };

  }


  /* -----------------------------------------
     FALL 3:
     payload als JSON String
     ----------------------------------------- */

  if (
    typeof payload === "string"
  ) {

    try {

      const parsed =
        JSON.parse(payload);

      if (
        parsed &&
        (
          parsed.dx !== undefined ||
          parsed.dy !== undefined
        )
      ) {

        return {
          dx: Number(parsed.dx),
          dy: Number(parsed.dy)
        };

      }

    } catch (error) {

      console.warn(
        "Payload ist kein JSON:",
        payload
      );

    }
  }


  return {
    dx: NaN,
    dy: NaN
  };
}


/* =========================================================
   POINTER MOVE
   ========================================================= */

function movePointer(message) {

  const movement =
    extractMovement(message);


  lastDX =
    movement.dx;

  lastDY =
    movement.dy;

  moveCount++;


  if (
    !Number.isFinite(movement.dx) ||
    !Number.isFinite(movement.dy)
  ) {

    updateDebug(
      "✗ KEIN GÜLTIGES dx/dy GEFUNDEN"
    );

    return;
  }


  pointerX +=
    movement.dx;

  pointerY +=
    movement.dy;


  /* Display-Grenzen */

  pointerX =
    Math.max(
      0,
      Math.min(
        window.innerWidth,
        pointerX
      )
    );

  pointerY =
    Math.max(
      0,
      Math.min(
        window.innerHeight,
        pointerY
      )
    );


  renderPointer();


  updateDebug(
    "✓ BEWEGUNG ANGEWENDET"
  );
}


/* =========================================================
   COMMAND HANDLER
   ========================================================= */

function handleCommand(message) {

  console.log(
    "OVERLAY COMMAND:",
    message
  );


  lastRawMessage =
    message;

  lastType =
    message?.type ?? null;

  lastPayload =
    message?.payload ?? null;


  if (!message) {
    return;
  }


  /* -----------------------------------------
     POINTER ENABLE
     ----------------------------------------- */

  if (
    message.type ===
    "POINTER_ENABLE"
  ) {

    enablePointer();

    return;
  }


  /* -----------------------------------------
     POINTER DISABLE
     ----------------------------------------- */

  if (
    message.type ===
    "POINTER_DISABLE"
  ) {

    disablePointer();

    return;
  }


  /* -----------------------------------------
     POINTER RESET
     ----------------------------------------- */

  if (
    message.type ===
    "POINTER_RESET"
  ) {

    resetPointer();

    updateDebug(
      "POINTER RESET"
    );

    return;
  }


  /* -----------------------------------------
     POINTER MOVE
     ----------------------------------------- */

  if (
    message.type ===
    "POINTER_MOVE"
  ) {

    /*
     * WICHTIG:
     * Die komplette message wird übergeben.
     * Nicht nur message.payload.
     */

    movePointer(
      message
    );

    return;
  }


  /* -----------------------------------------
     MODE CHANGE
     ----------------------------------------- */

  if (
    message.type ===
    "MODE_CHANGE"
  ) {

    const mode =
      message.payload?.mode ??
      message.mode ??
      "NONE";

    console.log(
      "MODE_CHANGE:",
      mode
    );

    if (mode === "SPOTLIGHT") {

      spotlightEnabled =
        true;

      pointerEnabled =
        false;

      pointer.style.display =
        "none";

      updateSpotlight();

      spotlight.classList.add(
        "active"
      );

      updateDebug(
        "SPOTLIGHT ON"
      );

    } else {

      spotlightEnabled =
        false;

      spotlight.classList.remove(
        "active"
      );

      updateDebug(
        "SPOTLIGHT OFF"
      );
    }

    return;
  }


  /* -----------------------------------------
     BLACK
     ----------------------------------------- */

  if (
    message.type ===
    "BLACK"
  ) {

    const enabled =
      Boolean(
        message.payload?.enabled
      );

    black.style.display =
      enabled
        ? "block"
        : "none";

    updateDebug(
      enabled
        ? "BLACK ON"
        : "BLACK OFF"
    );

    return;
  }


  /* -----------------------------------------
     ESCAPE
     ----------------------------------------- */

  if (
    message.type ===
    "ESCAPE"
  ) {

    pointerEnabled =
      false;

    spotlightEnabled =
      false;

    pointer.style.display =
      "none";

    spotlight.classList.remove(
      "active"
    );

    black.style.display =
      "none";

    resetPointer();

    updateDebug(
      "ESCAPE"
    );

    return;
  }


  updateDebug(
    `Unbekannter Command: ${message.type}`
  );
}


/* =========================================================
   ELECTRON IPC
   ========================================================= */

if (
  window.electronAPI &&
  typeof window.electronAPI.onCommand ===
    "function"
) {

  console.log(
    "✓ electronAPI vorhanden"
  );

  window.electronAPI.onCommand(
    handleCommand
  );

  console.log(
    "✓ IPC Listener registriert"
  );

} else {

  console.error(
    "✗ electronAPI fehlt"
  );
}


/* =========================================================
   ELECTRON READY
   ========================================================= */

if (
  window.electronAPI &&
  typeof window.electronAPI.onReady ===
    "function"
) {

  window.electronAPI.onReady(
    (data) => {

      console.log(
        "Overlay READY:",
        data
      );

      updateDebug(
        `Display ID: ${data?.displayId ?? "?"}`
      );

    }
  );
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  () => {

    pointerX =
      Math.max(
        0,
        Math.min(
          window.innerWidth,
          pointerX
        )
      );

    pointerY =
      Math.max(
        0,
        Math.min(
          window.innerHeight,
          pointerY
        )
      );

    renderPointer();

    updateDebug();
  }
);


/* =========================================================
   INITIAL
   ========================================================= */

resetPointer();

updateDebug(
  "Overlay bereit"
);

</script>

</body>
</html>
